# Dependabot — weekly security + minor updates.
#
# Scope:
#  - npm (production + dev deps)
#  - github-actions (SHA-pinned actions refresh suggestions)
#
# Strategy:
#  - Group semantically-equivalent updates to avoid PR firehose.
#  - Security updates are always separate (highest priority).
#  - Major bumps require manual triage.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-deps:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jest"
          - "@types/jest"
      lint-deps:
        patterns:
          - "eslint*"
          - "prettier"
      types:
        patterns:
          - "@types/*"
      viem-ecosystem:
        patterns:
          - "viem"
          - "abitype"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
